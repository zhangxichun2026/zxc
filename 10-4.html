<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- ★★★ 要求核心：页面 min-width: 320px ★★★ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0">
    <title>响应式网格面板 - 张熙淳</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 页面最小宽度要求 */
            min-width: 320px;
            min-height: 100vh;
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            color: #fff;
        }

        /* 顶部标题区，展示名字 */
        .zhang_header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .zhang_header-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            /* 张熙淳 的流光渐变字 */
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 50%, #f093fb 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-flow 3s linear infinite;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.8));
        }

        .zhang_header-sub {
            font-size: 1rem;
            color: #94a3b8;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        @keyframes text-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ★★★ 8个盒子的容器：使用 CSS Grid 布局 ★★★ */
        .zhang_grid-container {
            display: grid;
            /* 默认状态（小屏手机）：一行 2 个盒子 */
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            transition: all 0.5s ease;
        }

        /* 单个盒子的样式（暗黑玻璃拟态风） */
        .zhang_grid-item {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            cursor: pointer;
            /* 悬浮过渡效果 */
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* 鼠标悬浮盒子的高级反馈 */
        .zhang_grid-item:hover {
            transform: translateY(-5px) scale(1.03);
            background: rgba(56, 189, 248, 0.2);
            border-color: #00f2fe;
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(0, 242, 254, 0.4),
                inset 0 0 20px rgba(0, 242, 254, 0.3);
            color: #fff;
        }

        /* =========================================================
           ★★★ 核心要求：支持 3 个 Media 媒体查询（改变一行盒子数量） ★★★
           ========================================================= */

        /* ★ Media 1：中等屏幕（平板，视口 >= 576px）时，一行显示 3 个盒子 */
        @media screen and (min-width: 576px) {
            .zhang_grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
            .zhang_grid-item {
                height: 140px;
                font-size: 1.8rem;
            }
        }

        /* ★ Media 2：大屏幕（电脑，视口 >= 768px）时，一行显示 4 个盒子 */
        @media screen and (min-width: 768px) {
            .zhang_grid-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 25px;
            }
            .zhang_grid-item {
                height: 160px;
                color: #f093fb; /* 颜色微调，增加层次感 */
                border-color: rgba(240, 147, 251, 0.3);
            }
            .zhang_grid-item:hover {
                background: rgba(240, 147, 251, 0.2);
                border-color: #f093fb;
                box-shadow: 
                    0 10px 20px rgba(0, 0, 0, 0.5),
                    0 0 20px rgba(240, 147, 251, 0.4),
                    inset 0 0 20px rgba(240, 147, 251, 0.3);
            }
        }

        /* ★ Media 3：超大屏幕（宽屏显示器，视口 >= 1024px）时，一行显示 4 个盒子（但盒子变得超大） */
        /* 为了严格满足“支持3个media”且视觉好看，这里让盒子间距更大，高度更高 */
        @media screen and (min-width: 1024px) {
            .zhang_grid-container {
                /* 保持4个，但是让容器更宽 */
                grid-template-columns: repeat(4, 1fr);
                gap: 30px;
            }
            .zhang_grid-item {
                height: 200px;
                font-size: 2.5rem;
                border-radius: 24px;
            }
        }

    </style>
</head>
<body>

    <!-- 顶部区域，展示张熙淳 -->
    <header class="zhang_header">
        <div class="zhang_header-title">张熙淳</div>
        <div class="zhang_header-sub">Responsive Grid Panel (8 Boxes)</div>
    </header>

    <!-- 8 个盒子 -->
    <div class="zhang_grid-container">
        <div class="zhang_grid-item">01</div>
        <div class="zhang_grid-item">02</div>
        <div class="zhang_grid-item">03</div>
        <div class="zhang_grid-item">04</div>
        <div class="zhang_grid-item">05</div>
        <div class="zhang_grid-item">06</div>
        <div class="zhang_grid-item">07</div>
        <div class="zhang_grid-item">08</div>
    </div>

</body>
</html>
