<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .zhang_flex{
            /*容器*/
            display:flex;
            /*子元素在一行显示*/
            flex-wrap:wrap;
        }
        .zhang_flex li{
            /*项目*/
            border:1px solid #333;
            width:49%;
            line-height:100px;
            list-style:none;
            text-align:center;
            flex-grow:1;
            display:flex;
            /* 固定面板高度，让四个面板一样大 */
            height: 340px;
            box-sizing: border-box;
        }
        .zhang_flex li:nth-child(1){
            align-items:center;
            justify-content:center;
        }
        .zhang_box{
            /* 基础样式，黑边框保留 */
            border: 1px solid #333;
            box-sizing: border-box;
            /* 字体设置 */
            font-size: 20px;
            font-weight: bold;
            color: #333;
            /* 让文字在方块中完全居中 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ================= 以下是完全对应原图比例和位置的布局 ================= */

        /* ----- 面板 1：居中一个正方形 ----- */
        .zhang_flex li:nth-child(1) .zhang_box {
            width: 70px;
            height: 70px;
            background-color: #FFB6C1; /* 浅粉色 */
        }

        /* ----- 面板 2：上下两个长方形，每个宽50% ----- */
        .zhang_flex li:nth-child(2) {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .zhang_flex li:nth-child(2) .zhang_box {
            width: 50%; 
            height: 100px; /* 统一高度 */
            background-color: #87CEEB; /* 天蓝色 */
        }

        /* ----- 面板 3：两行两列，每个宽50%，统一高度 ----- */
        .zhang_flex li:nth-child(3) {
            flex-direction: column;
            justify-content: center;
            padding: 40px; 
            gap: 20px;
        }
        /* 让两行方块并排 */
        .zhang_flex li:nth-child(3) .zhang_row {
            display: flex;
            width: 100%;
            justify-content: center;
            gap: 20px;
        }
        .zhang_flex li:nth-child(3) .zhang_box {
            width: 50%;
            height: 100px;
            background-color: #98FB98; /* 浅绿色 */
        }

        /* ----- 面板 4：上一下二，上下宽度完全对齐 ----- */
        .zhang_flex li:nth-child(4) {
            flex-direction: column;
            justify-content: center;
            padding:0 40px; 
            gap: 20px;
        }
        /* 顶部大长条：占据宽度的 100% */
        .zhang_flex li:nth-child(4) > .zhang_box {
            width: 100%;
            height: 100px;
            background-color: #FFD700; /* 金黄色 */
        }
        /* 底部行容器：同样占据宽度的 100% */
        .zhang_flex li:nth-child(4) .zhang_bottom-row {
            display: flex;
            width: 100%; /* 宽度与上面的长条完全一致 */
            gap: 20px;   /* 两个方块之间的间距 */
        }
        /* 底部两个方块：各占行宽度的 50% */
        .zhang_flex li:nth-child(4) .zhang_bottom-row .zhang_box {
            width: 50%;
            height: 100px;
            background-color: #DDA0DD; /* 梅红色（紫色系） */
        }
    </style>
</head>
<body>
    <h2>张熙淳 flex</h2>
    <ul class="zhang_flex">
        <!-- 面板 1 -->
        <li>
            <div class="zhang_box">A1</div>
        </li>
        
        <!-- 面板 2 -->
        <li>
            <div class="zhang_box">B2</div>
            <div class="zhang_box">C3</div>
        </li>
        
        <!-- 面板 3 -->
        <li>
            <div class="zhang_row">
                <div class="zhang_box">D4</div>
                <div class="zhang_box">E5</div>
            </div>
            <div class="zhang_row">
                <div class="zhang_box">F6</div>
                <div class="zhang_box">G7</div>
            </div>
        </li>
        
        <!-- 面板 4 -->
        <li>
            <div class="zhang_box">H8 - 大长条</div>
            <div class="zhang_bottom-row">
                <div class="zhang_box">I9</div>
                <div class="zhang_box">J10</div>
            </div>
        </li>
    </ul>
</body>
</html>
