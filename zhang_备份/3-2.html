<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>415 张熙淳 · 扩展</title>
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        /* ---------- 标签选择器 p 基础 (橙色调) ---------- */
        p {
            color: #e67e22;
            font-size: 20px;
            margin: 6px 0;
        }

        /* ---------- 扩展二：h2 黑底白字 ---------- */
        h2 {
            background-color: #1e272e;      /* 深灰黑底，柔和 */
            color: #f1f2f6;
            padding: 10px 28px;
            display: inline-block;
            border-radius: 40px;
            letter-spacing: 2px;
            font-weight: 500;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        /* ---------- 主容器 #box (ID选择器) ---------- */
        #box {
            width: 360px;
            background-color: #2f3640;       /* 深色背景 */
            padding: 28px 24px;
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            transition: 0.2s;
            border: 1px solid #4a5260;
        }

        /* #box 内的 p 默认白色 (但个别覆盖) */
        #box p {
            color: #f5f6fa;
            margin: 12px 0;
            font-weight: 400;
        }

        /* ---------- 扩展三：「选择器」三个字为白色 ---------- */
        .selector-highlight {
            color: #ffffff;           /* 纯白 */
            font-weight: 600;
            background: #3d4b5a;      /* 微灰底让白色更突出，也可不加 */
            padding: 0 6px;
            border-radius: 6px;
        }

        /* ---------- 扩展一：名字每个字不同颜色，同行 ---------- */
        .name-zhang {
            color: #ff6b81;          /* 粉红 */
        }
        .name-xi {
            color: #7bed9f;          /* 薄荷绿 */
        }
        .name-chun {
            color: #70a1ff;          /* 亮蓝 */
        }

        .name-line {
            letter-spacing: 6px;
            font-weight: 600;
            font-size: 24px;          /* 稍大一点，更醒目 */
            background: #1e272e;
            display: inline-block;
            padding: 4px 18px 4px 14px;
            border-radius: 40px;
            margin: 6px 0 4px 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* #box 内第三个 p (学号+属性) 淡紫色，保留学号信息 */
        #box p:last-of-type {
            color: #a29bfe;
            font-weight: 300;
            letter-spacing: 1px;
            border-top: 1px dashed #4a5260;
            padding-top: 14px;
            margin-top: 14px;
        }

        /* 第一个 p 中的 "CSSx" 保持橙色（继承 p 的 color），但为了清晰单独强调 */
        #box p:first-of-type {
            color: #f39c12;           /* 金色橙，更亮 */
            font-weight: 500;
        }

        /* 微调白色「选择器」在橙色背景上更明显 */
        .selector-highlight {
            background: #2b3a47;
            padding: 2px 10px;
            border-radius: 30px;
            margin-left: 4px;
        }

        /* 附加小点缀：让整个卡片更精致 */
        .sub-note {
            color: #7f8fa6;
            font-size: 14px;
            margin-top: 18px;
            letter-spacing: 1px;
        }

        /* ---------- 新增自由扩展：额外白色盒子 (按要求也可做扩展3的变体) 
             但这里已经实现了「选择器三个字是白色」，为了完整也保留一个纯装饰盒子 
             但没有强制，只作为可选项。为满足“或新增宽高背景”，此处增加一个300x300盒子，背景渐变色
             同时不影响原有结构，放在下方作为额外展示。
        ---------- */
        .extra-box {
            width: 300px;
            height: 300px;
            background: linear-gradient(145deg, #2d3436, #1e272e);
            margin-top: 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #dfe6e9;
            font-size: 18px;
            font-weight: 300;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            border: 1px solid #4a5260;
            transition: 0.2s;
            letter-spacing: 2px;
        }

        .extra-box span {
            background: #2f3640;
            padding: 12px 24px;
            border-radius: 60px;
            color: #f1f2f6;
            border-left: 3px solid #f39c12;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            #box {
                width: 92%;
                padding: 20px 16px;
            }
            .extra-box {
                width: 92%;
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <!-- 扩展二：h2 黑底白字 -->
    <h2>层叠样式表 CSS</h2>

    <!-- 主容器 #box (ID选择器) -->
    <div id="box">
        <!-- 扩展三：「选择器」三个字是白色，前面 "CSSx" 保持 p 的橙色调 -->
        <p>CSSx<span class="selector-highlight">选择器</span></p>

        <!-- 扩展一：名字的每个字不同颜色，且在同一行 —— 张 熙 淳 -->
        <p class="name-line">
            <span class="name-zhang">张</span>
            <span class="name-xi">熙</span>
            <span class="name-chun">淳</span>
        </p>

        <!-- 学号 415 保留，并带有 "CSS属性" 字样 (淡紫色) -->
        <p>415  ·  CSS属性</p>
    </div>

    <!-- 额外扩展：宽300高300，有背景颜色的盒子 (作为扩展3的替代或补充) 
         因为要求“或新增一个宽300高300的盒子，有背景颜色”，此处实现 -->
    <div class="extra-box">
        <span>✦ 300×300 ✦</span>
    </div>

    <!-- 底部小提示（纯装饰） -->
    <div class="sub-note">扩展1 · 名字彩色 · 扩展2 · h2黑底白字 · 扩展3 · 选择器白色</div>

</body>
</html>
