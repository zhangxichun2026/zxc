<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张熙淳 - 个人主页</title>
    <style>
        /* ========== 全局重置 & 基础 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* ========== 主容器 ========== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 50px 45px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        /* ========== 头部 ========== */
        .header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 3px solid #e8edf5;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 18px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 40%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            display: inline-block;
        }

        .header .subtitle {
            display: block;
            font-size: 16px;
            color: #8892a8;
            letter-spacing: 6px;
            margin-top: 8px;
            font-weight: 300;
        }

        /* ========== 超链接区域 ========== */
        .links-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .links-section a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #2d6a9f, #1a3a5c);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 15px rgba(45, 106, 159, 0.35);
            letter-spacing: 1px;
        }

        .links-section a:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 35px rgba(45, 106, 159, 0.5);
            background: linear-gradient(135deg, #3a7ec0, #1f4a72);
        }

        .links-section a:active {
            transform: scale(0.96);
        }

        /* ========== 图片区域 ========== */
        .images-section {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 40px;
        }

        .images-section .img-wrapper {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 3px solid rgba(255, 255, 255, 0.6);
            background: #fff;
            line-height: 0;
        }

        .images-section .img-wrapper:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
            border-color: #4facfe;
        }

        .images-section .img-wrapper img {
            width: 420px;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        .images-section .img-wrapper:hover img {
            transform: scale(1.03);
        }

        .img-caption {
            text-align: center;
            font-size: 13px;
            color: #8892a8;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* ========== 分割线 ========== */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px 0 35px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c3cfe2, transparent);
        }

        .divider span {
            font-size: 28px;
            opacity: 0.6;
        }

        /* ========== 表格区域 ========== */
        .table-section {
            margin-top: 10px;
        }

        .table-title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #1a3a5c;
            letter-spacing: 6px;
            margin-bottom: 25px;
        }

        .table-title small {
            font-size: 16px;
            font-weight: 400;
            color: #8892a8;
            letter-spacing: 2px;
            display: block;
            margin-top: 4px;
        }

        /* ----- 表格美化 ----- */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
            font-size: 16px;
        }

        thead th {
            background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
            color: #ffffff;
            padding: 18px 22px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            border: none;
        }

        thead th:not(:last-child) {
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }

        tbody td {
            padding: 16px 22px;
            text-align: center;
            border: none;
            background: #ffffff;
            color: #2d3748;
            font-weight: 450;
            transition: background 0.25s ease;
            border-bottom: 1px solid #f0f2f5;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: #ebf5ff;
        }

        /* 序号列 */
        tbody td:first-child {
            font-weight: 700;
            color: #2d6a9f;
            font-size: 18px;
        }

        /* 名称列加粗 */
        tbody td:nth-child(2) {
            font-weight: 600;
        }

        /* 隔行变色（更柔和） */
        tbody tr:nth-child(even) td {
            background: #f8faff;
        }

        tbody tr:nth-child(even):hover td {
            background: #ebf5ff;
        }

        /* ========== 页脚 ========== */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px solid #e8edf5;
            color: #a0aec0;
            font-size: 14px;
            letter-spacing: 3px;
        }

        .footer span {
            color: #f5576c;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .container {
                padding: 25px 18px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 34px;
                letter-spacing: 10px;
            }

            .links-section {
                flex-direction: column;
                align-items: center;
            }

            .links-section a {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
                font-size: 15px;
            }

            .images-section .img-wrapper img {
                width: 100%;
                max-width: 400px;
            }

            .table-title {
                font-size: 22px;
                letter-spacing: 3px;
            }

            table {
                font-size: 14px;
                border-radius: 12px;
            }

            thead th,
            tbody td {
                padding: 12px 12px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 26px;
                letter-spacing: 6px;
            }

            .container {
                padding: 18px 12px;
            }

            thead th,
            tbody td {
                padding: 10px 8px;
                font-size: 12px;
            }

            .table-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

</body>
</html>
