<!DOCTYPE html>
<html lang="zh-CN">
<!-- 姓名：张熙淳，建立时间：2026-11-05，使用模型：GLM-5.3-Flash，功能名称：SVG绘制基于图像识别的系统架构图 科研方向 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 架构图 · 图像识别系统（科研方向） · 张熙淳</title>
    <style>
        :root {
            --zxc_bg: #0d1117;
            --zxc_border: #262d3d;
            --zxc_ink: #e6edf3;
            --zxc_muted: #8b949e;
            --zxc_accent: #4ea8de;
            --zxc_ok: #3fb950;
            --zxc_warn: #e3b341;
            --zxc_pink: #f778ba;
            --zxc_purple: #b392f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 1.6rem 1rem 2.5rem;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            color: var(--zxc_ink);
            background: radial-gradient(1000px 460px at 80% -10%, #142b22 0%, var(--zxc_bg) 55%) fixed;
        }

        .zxc_page { max-width: 60rem; margin: 0 auto; }

        .zxc_header { text-align: center; margin-bottom: 1.2rem; }

        .zxc_header h1 { margin: 0 0 0.4rem; font-size: 1.4rem; }

        .zxc_header p { margin: 0; color: var(--zxc_muted); font-size: 0.84rem; }

        .zxc_stage {
            border: 1px solid var(--zxc_border);
            border-radius: 12px;
            overflow: hidden;
            background: #0a0e14;
        }

        svg { display: block; width: 100%; height: auto; }

        /* SVG 内部样式：层组、模块、流动箭头 */
        .zxc_grp { fill: rgba(255, 255, 255, 0.02); stroke-width: 1.5; stroke-dasharray: 6 4; }

        .zxc_mod { fill: rgba(255, 255, 255, 0.05); stroke-width: 1.4; }

        .zxc_name { font-size: 12px; font-weight: bold; }

        .zxc_item { font-size: 13px; font-weight: bold; }

        .zxc_sub { font-size: 10.5px; fill: #8b949e; }

        .zxc_label { font-size: 11px; fill: #8b949e; }

        .zxc_title { font-size: 20px; font-weight: bold; fill: #e6edf3; }

        .zxc_note { font-size: 11.5px; fill: #8b949e; }

        /* 流动虚线动画（数据在架构中流动的效果） */
        .zxc_flow {
            stroke-dasharray: 7 5;
            animation: zxc_dashmove 0.9s linear infinite;
        }

        @keyframes zxc_dashmove {
            to { stroke-dashoffset: -12; }
        }

        .zxc_ctrl { text-align: center; margin-top: 1rem; }

        .zxc_btn {
            padding: 0.5rem 1.4rem;
            font-size: 0.85rem;
            color: #fff;
            background: linear-gradient(135deg, #1f8f4e, #3fb950);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .zxc_btn:hover { transform: translateY(-1px); opacity: 0.92; }

        .zxc_footer { margin-top: 1.4rem; text-align: center; font-size: 0.78rem; color: var(--zxc_muted); }

        .zxc_legend {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            font-size: 0.78rem;
            color: var(--zxc_muted);
        }

        .zxc_legend span::before {
            content: "";
            display: inline-block;
            width: 0.75rem; height: 0.75rem;
            margin-right: 0.35rem;
            border-radius: 3px;
            vertical-align: -1px;
        }

        .zxc_legend .zxc_l1::before { background: #f778ba; }
        .zxc_legend .zxc_l2::before { background: #b392f0; }
        .zxc_legend .zxc_l3::before { background: #3fb950; }
        .zxc_legend .zxc_l4::before { background: #4ea8de; }
        .zxc_legend .zxc_l5::before { background: #e3b341; }
    </style>
</head>
<body>

                <text class="zxc_item" x="387" y="576" fill="#e3b341" text-anchor="middle">可视化分析</text>
                <text class="zxc_sub" x="387" y="594" text-anchor="middle">实验图表 · 报告</text>

        <div class="zxc_legend">

        <footer class="zxc_footer">
            高级网页设计 · 张熙淳 24002060415 · 原生 SVG + CSS 动画（无任何第三方库）
        </footer>
    </div>

    <script>
        // 暂停 / 继续：切换 SVG 动画的播放状态（原生 classList 控制）
        var zxc_anim_on = true;
        document.getElementById("zxc_btn_toggle").addEventListener("click", function () {
            zxc_anim_on = !zxc_anim_on;
            var zxc_flows = document.querySelectorAll("#zxc_svg .zxc_flow");
            for (var zxc_i = 0; zxc_i < zxc_flows.length; zxc_i++) {
                zxc_flows[zxc_i].style.animationPlayState = zxc_anim_on ? "running" : "paused";
            }
            this.textContent = zxc_anim_on ? "暂停流动动画" : "继续流动动画";
        });
    </script>
</body>
</html>
