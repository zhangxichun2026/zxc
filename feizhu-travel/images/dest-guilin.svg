<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="桂林漓江山水">
  <defs>
    <linearGradient id="gl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8ea"/>
      <stop offset="0.55" stop-color="#eef8f6"/>
      <stop offset="1" stop-color="#fbfefc"/>
    </linearGradient>
    <linearGradient id="gl-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dc4b4"/>
      <stop offset="1" stop-color="#c3d9cf"/>
    </linearGradient>
    <linearGradient id="gl-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ba787"/>
      <stop offset="1" stop-color="#8dbda2"/>
    </linearGradient>
    <linearGradient id="gl-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7a5c"/>
      <stop offset="1" stop-color="#2b5b45"/>
    </linearGradient>
    <linearGradient id="gl-river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7d6cb"/>
      <stop offset="0.5" stop-color="#7cbcae"/>
      <stop offset="1" stop-color="#4d9587"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gl-sky)"/>
  <circle cx="640" cy="120" r="44" fill="#ffffff" opacity="0.75"/>
  <circle cx="640" cy="120" r="78" fill="#ffffff" opacity="0.28"/>

  <!-- 远山 -->
  <path d="M0 320 Q60 236 118 300 Q150 336 182 320 Q236 250 292 314 Q330 352 366 322 Q420 250 470 316 Q520 352 566 318 Q620 260 672 316 Q720 356 760 320 Q784 302 800 316 L800 400 L0 400 Z" fill="url(#gl-far)" opacity="0.7"/>

  <!-- 中景喀斯特 -->
  <g fill="url(#gl-mid)">
    <path d="M-20 420 Q40 268 108 282 Q168 296 168 420 Z"/>
    <path d="M150 420 Q196 300 250 292 Q306 286 318 420 Z"/>
    <path d="M520 420 Q560 296 620 288 Q684 282 700 420 Z"/>
    <path d="M676 420 Q716 316 768 306 Q812 298 820 420 Z"/>
  </g>
  <g fill="#4f8f70" opacity="0.35">
    <path d="M108 282 Q120 340 118 420 L108 420 Q96 340 108 282 Z"/>
    <path d="M250 292 Q262 350 258 420 L246 420 Q240 352 250 292 Z"/>
    <path d="M620 288 Q632 350 628 420 L618 420 Q610 350 620 288 Z"/>
  </g>

  <!-- 江面 -->
  <path d="M0 414 H800 V600 H0 Z" fill="url(#gl-river)"/>
  <g stroke="#ffffff" stroke-width="3" opacity="0.45">
    <path d="M80 452 h150"/><path d="M300 478 h190"/><path d="M560 456 h150"/>
    <path d="M160 524 h180"/><path d="M470 542 h200"/>
  </g>
  <!-- 山影 -->
  <g fill="#2f6a58" opacity="0.22">
    <path d="M40 414 h100 l-30 60 h-50 Z"/>
    <path d="M520 414 h140 l-34 54 h-74 Z"/>
  </g>

  <!-- 竹筏与渔翁 -->
  <g transform="translate(300 470)">
    <rect x="0" y="30" width="140" height="9" rx="4.5" fill="#8a6a44"/>
    <g stroke="#6f5233" stroke-width="2" opacity="0.6">
      <path d="M18 30 v9"/><path d="M46 30 v9"/><path d="M74 30 v9"/><path d="M102 30 v9"/><path d="M128 30 v9"/>
    </g>
    <path d="M56 30 L58 6 L64 6 L64 30 Z" fill="#3f5f5a"/>
    <circle cx="61" cy="0" r="7" fill="#3f5f5a"/>
    <path d="M48 -2 L76 -2 L72 -8 L52 -8 Z" fill="#c9a86a"/>
    <path d="M64 8 L96 22" stroke="#6f5233" stroke-width="3"/>
    <!-- 鸬鹚 -->
    <path d="M108 30 Q104 16 114 12 Q122 9 122 18 Q122 26 116 30 Z" fill="#2b3434"/>
    <path d="M120 16 L132 12 L122 20 Z" fill="#2b3434"/>
  </g>

  <!-- 前景竹叶 -->
  <g fill="#2f5f47" opacity="0.9">
    <path d="M0 0 Q60 40 84 110 Q40 74 0 62 Z"/>
    <path d="M0 40 Q44 84 56 150 Q20 110 0 96 Z"/>
    <path d="M800 20 Q740 56 716 118 Q756 84 800 74 Z"/>
  </g>

  <!-- 雾 -->
  <rect y="330" width="800" height="60" fill="#ffffff" opacity="0.35"/>
  <rect y="258" width="800" height="26" fill="#ffffff" opacity="0.22"/>
</svg>
