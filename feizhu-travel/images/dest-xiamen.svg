  <!-- 渡轮 -->
  <g transform="translate(120 400)">
    <path d="M0 26 L104 26 L92 44 L12 44 Z" fill="#f3f0e8"/>
    <path d="M0 26 L104 26 L104 30 L0 30 Z" fill="#2b6a8c"/>
    <rect x="18" y="6" width="66" height="20" rx="4" fill="#ffffff"/>
    <g fill="#7fb6cf">
      <rect x="24" y="11" width="10" height="9" rx="1.5"/>
      <rect x="40" y="11" width="10" height="9" rx="1.5"/>
      <rect x="56" y="11" width="10" height="9" rx="1.5"/>
      <rect x="72" y="11" width="6" height="9" rx="1.5"/>
    </g>
    <rect x="46" y="-6" width="10" height="12" fill="#e8e3d8"/>
  </g>

  <!-- 椰子 -->
  <g transform="translate(60 180)">
    <path d="M52 190 C48 132 58 92 76 56" fill="none" stroke="#6d5136" stroke-width="12" stroke-linecap="round"/>
    <g fill="#276b4c">
      <path d="M76 56 C46 40 18 48 0 70 C24 64 42 68 58 78 Z"/>
      <path d="M76 56 C68 22 78 0 98 -18 C94 10 90 32 86 50 Z"/>
      <path d="M76 56 C96 26 124 18 148 30 C124 40 108 50 94 68 Z"/>
      <path d="M76 56 C104 52 130 64 142 86 C118 76 100 72 84 74 Z"/>
    </g>
  </g>

  <!-- 前景浪 -->
  <path d="M0 588 Q160 558 320 582 Q480 606 640 580 Q720 568 800 578 L800 600 L0 600 Z" fill="#ffffff" opacity="0.5"/>
</svg>
