<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="成都竹林与熊猫">
  <defs>
    <linearGradient id="cd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0e4"/>
      <stop offset="0.6" stop-color="#f6faf3"/>
      <stop offset="1" stop-color="#fdfcf7"/>
    </linearGradient>
    <linearGradient id="cd-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8cdb6"/>
      <stop offset="1" stop-color="#9db9a4"/>
    </linearGradient>
    <linearGradient id="cd-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e3cc"/>
      <stop offset="1" stop-color="#c2d1b2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cd-sky)"/>

  <!-- 远山 -->
  <path d="M0 300 Q110 226 220 276 Q320 320 420 280 Q540 232 650 282 Q730 318 800 296 L800 400 L0 400 Z" fill="url(#cd-far)" opacity="0.6"/>
  <path d="M0 344 Q140 300 270 336 Q400 372 530 338 Q660 304 800 342 L800 430 L0 430 Z" fill="#9db9a4" opacity="0.5"/>

  <!-- 地面 -->
  <path d="M0 396 Q200 372 400 396 Q600 420 800 392 L800 600 L0 600 Z" fill="url(#cd-floor)"/>

  <!-- 中景竹丛 -->
  <g stroke="#7fa87f" stroke-width="9" stroke-linecap="round" opacity="0.65">
    <path d="M112 600 L104 288"/><path d="M168 600 L176 246"/>
    <path d="M690 600 L700 262"/><path d="M744 600 L734 300"/>
  </g>
  <g stroke="#7fa87f" stroke-width="9" stroke-linecap="round" opacity="0.65">
    <path d="M104 372 h-26"/><path d="M176 330 h28"/><path d="M700 348 h-30"/><path d="M734 386 h26"/>
  </g>

  <!-- 熊猫 -->
  <g transform="translate(430 300)">
    <!-- 身体 -->
    <path d="M-42 150 Q-58 84 -18 68 Q26 52 62 76 Q96 98 84 148 Z" fill="#ffffff"/>
    <path d="M-42 150 Q-58 84 -18 68 Q26 52 62 76 Q96 98 84 148 Z" fill="none" stroke="#dfe3dc" stroke-width="3"/>
    <!-- 四肢 -->
    <ellipse cx="-30" cy="140" rx="26" ry="18" fill="#2b2b2b" transform="rotate(-16 -30 140)"/>
    <ellipse cx="72" cy="140" rx="26" ry="18" fill="#2b2b2b" transform="rotate(16 72 140)"/>
    <!-- 头 -->
    <circle cx="10" cy="28" r="46" fill="#ffffff"/>
    <circle cx="-30" cy="-8" r="17" fill="#2b2b2b"/>
    <circle cx="50" cy="-8" r="17" fill="#2b2b2b"/>
    <ellipse cx="-8" cy="24" rx="13" ry="16" fill="#2b2b2b" transform="rotate(-18 -8 24)"/>
    <ellipse cx="30" cy="24" rx="13" ry="16" fill="#2b2b2b" transform="rotate(18 30 24)"/>
    <circle cx="-8" cy="22" r="5" fill="#ffffff"/>
    <circle cx="30" cy="22" r="5" fill="#ffffff"/>
    <ellipse cx="11" cy="52" rx="10" ry="7" fill="#2b2b2b"/>
    <path d="M11 59 Q4 68 -4 64 M11 59 Q18 68 26 64" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 前景竹 -->
  <g>
    <path d="M28 600 L40 120" stroke="#3f7a4f" stroke-width="18" stroke-linecap="round"/>
    <path d="M108 600 L96 190" stroke="#4a8a58" stroke-width="14" stroke-linecap="round"/>
    <path d="M770 600 L760 150" stroke="#3f7a4f" stroke-width="18" stroke-linecap="round"/>
    <g stroke="#2f6040" stroke-width="4" opacity="0.5">
      <path d="M35 300 h14"/><path d="M38 240 h14"/><path d="M33 380 h14"/>
      <path d="M100 330 h12"/><path d="M98 270 h12"/>
      <path d="M766 260 h14"/><path d="M763 340 h14"/>
    </g>
    <g fill="#4d8a5c">
      <path d="M40 250 Q-6 226 -44 246 Q-4 256 38 268 Z"/>
      <path d="M42 214 Q14 178 -20 172 Q8 200 32 230 Z"/>
      <path d="M44 186 Q80 156 118 166 Q84 190 56 206 Z"/>
      <path d="M98 300 Q60 274 20 286 Q58 302 94 316 Z"/>
      <path d="M762 300 Q720 274 684 288 Q722 304 758 316 Z"/>
      <path d="M760 250 Q790 214 800 190 L800 240 Q784 250 768 262 Z"/>
    </g>
  </g>

  <!-- 雾气 -->
  <rect y="300" width="800" height="40" fill="#ffffff" opacity="0.3"/>
</svg>
