<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级图文轮播 - 张熙淳</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            /* 高级暗色网格背景，凸显主体 */
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 幻灯片主容器 */
        .zhang_slideshow {
            width: 750px;
            height: 450px;
            background: #000;
            border-radius: 16px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 鼠标悬浮时整体微微上浮 */
        .zhang_slideshow:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: 
                0 35px 60px -15px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        /* 图片样式：绝对定位，纯位置移动动画 */
        .zhang_slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 初始都在右侧外面待命 */
            transform: translateX(100%); 
            animation: slide-in 12s infinite;
            z-index: 1;
        }

        /* 三张图的播放延迟 */
        .zhang_slideshow img:nth-child(1) { animation-delay: 0s; }
        .zhang_slideshow img:nth-child(2) { animation-delay: 4s; }
        .zhang_slideshow img:nth-child(3) { animation-delay: 8s; }

        /* 核心无缝滑动动画 */
        @keyframes slide-in {
            0% { transform: translateX(100%); z-index: 2; }   /* 从右侧进 */
            6% { transform: translateX(0); z-index: 2; }      /* 到达中心 */
            33% { transform: translateX(0); z-index: 2; }     /* 停留展示 */
            39% { transform: translateX(-100%); z-index: 1; } /* 向左滑出并降低层级 */
            100% { transform: translateX(-100%); z-index: 1; }/* 在左侧等待 */
        }

        /* 顶部高光扫过特效 */
        .zhang_slideshow::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes shine {
            0%, 70% { left: -150%; }
            90%, 100% { left: 200%; }
        }

        /* ★★★ 核心要求：字在图上，透明背景，黑底白字 ★★★ */
        .zhang_caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 60px 30px 30px;
            /* 纯黑渐变透明背景，保证底部是黑的，字是白的 */
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 50%, rgba(0, 0, 0, 0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 10;
            pointer-events: none;
        }

        /* 纯白文字，加上轻微的发光效果 */
        .zhang_caption-text {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 20px rgba(255,255,255,0.3);
            /* 呼吸动画 */
            animation: text-breathe 2s ease-in-out infinite alternate;
        }

        @keyframes text-breathe {
            from { transform: scale(1); letter-spacing: 8px; opacity: 0.8; }
            to { transform: scale(1.05); letter-spacing: 12px; opacity: 1; }
        }

        /* 底部进度条 (高级组件感) */
        .zhang_progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6); /* 蓝紫渐变 */
            animation: progress 12s linear infinite;
            z-index: 11;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* 右上角的播放指示点 (纯CSS实现，提升逼格) */
        .zhang_dots {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 12;
        }

        .zhang_dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            animation: dot-active 12s infinite;
        }

        .zhang_dot:nth-child(1) { animation-delay: 0s; }
        .zhang_dot:nth-child(2) { animation-delay: 4s; }
        .zhang_dot:nth-child(3) { animation-delay: 8s; }

        @keyframes dot-active {
            0%, 33% { background-color: #ffffff; transform: scale(1.3); box-shadow: 0 0 10px #fff; }
            34%, 100% { background-color: rgba(255, 255, 255, 0.3); transform: scale(1); box-shadow: none; }
        }

    </style>
</head>
<body>

    <div class="zhang_slideshow">
        <!-- 严格按照黑板要求使用 img 目录下的 1.jpg 到 3.jpg -->
        <img src="1.jpg" alt="幻灯片图片 1">
        <img src="2.jpg" alt="幻灯片图片 2">
        <img src="3.jpg" alt="幻灯片图片 3">
        
        <!-- 右上角指示点 -->
        <div class="zhang_dots">
            <div class="zhang_dot"></div>
            <div class="zhang_dot"></div>
            <div class="zhang_dot"></div>
        </div>

        <!-- 文字区域：完全符合黑板上“字在图片上，透明背景，黑底白字”的要求 -->
        <div class="zhang_caption">
            <div class="zhang_caption-text">张熙淳</div>
        </div>
        
        <!-- 底部进度条 -->
        <div class="zhang_progress-bar"></div>
    </div>

</body>
</html>
