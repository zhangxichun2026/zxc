<!DOCTYPE html>
<html lang="zh-CN">
<!-- 姓名：张熙淳，建立时间：2026-11-02，使用模型：GLM-5.3-Flash，功能名称：fetch 获取接口数据 商品列表与详情 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch 获取接口数据 · 商品列表与详情 · 张熙淳</title>
    <style>
        :root {
            --zxc_bg: #0d1117;
            --zxc_card: #161b26;
            --zxc_border: #262d3d;
            --zxc_ink: #e6edf3;
            --zxc_muted: #8b949e;
            --zxc_accent: #4ea8de;
            --zxc_ok: #3fb950;
            --zxc_warn: #e3b341;
            --zxc_bad: #f85149;
            --zxc_pink: #f778ba;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 2rem 1rem 3rem;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            color: var(--zxc_ink);
            background: radial-gradient(1100px 500px at 85% -10%, #142a20 0%, var(--zxc_bg) 55%) fixed;
        }

        .zxc_page { max-width: 66rem; margin: 0 auto; }

        .zxc_header { text-align: center; margin-bottom: 1.4rem; }

        .zxc_header h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }

        .zxc_header p { margin: 0; color: var(--zxc_muted); font-size: 0.85rem; }

        .zxc_api {
            margin: 0 auto 1.4rem;
            max-width: 40rem;
            padding: 0.55rem 0.9rem;
            font-family: Consolas, monospace;
            font-size: 0.78rem;
            color: var(--zxc_ok);
            background: #0a0e14;
            border: 1px solid var(--zxc_border);
            border-radius: 8px;
            text-align: center;
            word-break: break-all;
        }

        /* 状态条 */
        .zxc_status {
            display: none;
            margin: 0 auto 1rem;
            max-width: 40rem;
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            border-radius: 8px;
            text-align: center;
        }

        .zxc_status.zxc_loading { display: block; color: var(--zxc_warn); background: rgba(227, 179, 65, 0.12); border: 1px solid rgba(227, 179, 65, 0.45); }
        .zxc_status.zxc_error { display: block; color: #ffb3ad; background: rgba(248, 81, 73, 0.12); border: 1px solid rgba(248, 81, 73, 0.45); }

        .zxc_status .zxc_spin {
            display: inline-block;
            width: 0.85rem; height: 0.85rem;
            vertical-align: -2px;
            margin-right: 0.4rem;
            border: 2px solid var(--zxc_warn);
            border-top-color: transparent;
            border-radius: 50%;
            animation: zxc_spin 0.8s linear infinite;
        }

        @keyframes zxc_spin { to { transform: rotate(360deg); } }

        /* 商品网格 */
        .zxc_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
            gap: 1rem;
        }

        .zxc_item {
            background: var(--zxc_card);
            border: 1px solid var(--zxc_border);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease;
            animation: zxc_pop 0.3s ease;
        }

        @keyframes zxc_pop {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .zxc_item:hover { transform: translateY(-4px); border-color: var(--zxc_accent); }

        .zxc_item.zxc_active { border-color: var(--zxc_ok); box-shadow: 0 0 0 1px var(--zxc_ok); }

        .zxc_item img {
            width: 100%;
            height: 9.5rem;
            object-fit: cover;
            display: block;
            background: #fff;
        }

        .zxc_body { padding: 0.7rem 0.8rem 0.85rem; }

        .zxc_title {
            margin: 0 0 0.3rem;
            font-size: 0.88rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .zxc_meta { margin: 0; font-size: 0.74rem; color: var(--zxc_muted); }

        .zxc_row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 0.45rem; }

        .zxc_price { color: var(--zxc_bad); font-size: 1.05rem; font-weight: bold; }

        .zxc_price small { font-size: 0.7rem; }

        .zxc_rate { color: var(--zxc_warn); font-size: 0.76rem; }

        /* 详情面板 */
        .zxc_detail {
            display: none;
            margin-top: 1.4rem;
            background: var(--zxc_card);
            border: 1px solid var(--zxc_border);
            border-radius: 12px;
            padding: 1.2rem;
            animation: zxc_pop 0.3s ease;
        }

        .zxc_detail.zxc_show { display: flex; gap: 1.4rem; flex-wrap: wrap; }

        .zxc_detail img {
            flex: none;
            width: 17rem;
            max-width: 100%;
            height: 13rem;
            object-fit: cover;
            border-radius: 8px;
            background: #fff;
        }

        .zxc_detail_info { flex: 1; min-width: 16rem; }

        .zxc_detail_info h2 { margin: 0 0 0.2rem; font-size: 1.15rem; color: var(--zxc_accent); }

        .zxc_brand { margin: 0 0 0.8rem; font-size: 0.78rem; color: var(--zxc_muted); }

        .zxc_desc { margin: 0 0 0.9rem; font-size: 0.85rem; line-height: 1.8; }

        .zxc_tags { display: flex; flex-wrap: wrap; gap: 0.45rem; }

        .zxc_tag {
            padding: 0.22rem 0.6rem;
            font-size: 0.74rem;
            background: #1c2333;
            border: 1px solid var(--zxc_border);
            border-radius: 999px;
        }

        .zxc_kv {
            display: inline-flex;
            align-items: baseline;
            gap: 0.4rem;
            margin: 0 1.2rem 0.5rem 0;
            font-size: 0.82rem;
        }

        .zxc_kv b { color: var(--zxc_muted); font-weight: normal; }

        .zxc_kv .zxc_num { color: var(--zxc_ok); font-weight: bold; }

        .zxc_footer { margin-top: 2.4rem; text-align: center; font-size: 0.8rem; color: var(--zxc_muted); }
    </style>
</head>
<body>
    <div class="zxc_page">
        <header class="zxc_header">
            <h1>fetch 获取接口数据 — 商品列表与详情</h1>
            <p>张熙淳 24002060415 · 2026-11-02 · 点击任意商品卡片，加载该商品详情</p>
        </header>

        <div class="zxc_api">列表 GET https://dummyjson.com/products?limit=8</div>

        <div class="zxc_status" id="zxc_status"></div>

        <main class="zxc_grid" id="zxc_grid"></main>

        <section class="zxc_detail" id="zxc_detail"></section>

        <footer class="zxc_footer">
            高级网页设计 · 张熙淳 24002060415 · 原生 fetch + HTML + CSS + JavaScript
        </footer>
    </div>

    <script>
        var zxc_API_LIST = "https://dummyjson.com/products?limit=8";
        var zxc_API_DETAIL = "https://dummyjson.com/products/"; // + id
        var zxc_status = document.getElementById("zxc_status");

        function zxc_show_status(zxc_text, zxc_type) {
            if (!zxc_text) { zxc_status.className = "zxc_status"; zxc_status.innerHTML = ""; return; }
            zxc_status.className = "zxc_status " + zxc_type;
            zxc_status.innerHTML = (zxc_type === "zxc_loading" ? "<span class='zxc_spin'></span>" : "") + zxc_text;
        }

        function zxc_escape(zxc_s) { return String(zxc_s).replace(/</g, "&lt;"); }

        // ================= 1. 加载商品列表 =================
        function zxc_load_list() {
            zxc_show_status("正在通过 fetch 请求商品列表……", "zxc_loading");
            fetch(zxc_API_LIST)                          // 核心：原生 fetch，接口支持跨域
                .then(function (zxc_res) {
                    if (!zxc_res.ok) { throw new Error("HTTP 状态码 " + zxc_res.status); }
                    return zxc_res.json();               // 把响应体解析为 JS 对象
                })
                .then(function (zxc_data) {
                    zxc_show_status("");                 // 隐藏加载提示
                    zxc_render_list(zxc_data.products);
                })
                .catch(function (zxc_err) {              // 网络失败、断网等都会进入 catch
                    zxc_show_status("请求失败：" + zxc_err.message + "，请检查网络后刷新重试。", "zxc_error");
                });
        }

        function zxc_render_list(zxc_products) {
            var zxc_grid = document.getElementById("zxc_grid");
            var zxc_html = "";
            for (var zxc_i = 0; zxc_i < zxc_products.length; zxc_i++) {
                var zxc_p = zxc_products[zxc_i];
                zxc_html +=
                    "<article class='zxc_item' data-zxc_id='" + zxc_p.id + "'>" +
                        "<img src='" + zxc_p.thumbnail + "' alt='" + zxc_escape(zxc_p.title) + "'>" +
                        "<div class='zxc_body'>" +
                            "<h3 class='zxc_title'>" + zxc_escape(zxc_p.title) + "</h3>" +
                            "<p class='zxc_meta'>" + zxc_escape(zxc_p.brand) + " · " + zxc_escape(zxc_p.category) + "</p>" +
                            "<div class='zxc_row'>" +
                                "<span class='zxc_price'><small>$</small>" + zxc_p.price.toFixed(2) + "</span>" +
                                "<span class='zxc_rate'>★ " + zxc_p.rating.toFixed(2) + "</span>" +
                            "</div>" +
                        "</div>" +
                    "</article>";
            }
            zxc_grid.innerHTML = zxc_html;

            // 事件委托：点击卡片 → 加载详情
            zxc_grid.addEventListener("click", function (zxc_e) {
                var zxc_card = zxc_e.target.closest(".zxc_item");
                if (zxc_card) { zxc_load_detail(Number(zxc_card.getAttribute("data-zxc_id"))); }
            });
        }

        // ================= 2. 加载商品详情 =================
        function zxc_load_detail(zxc_id) {
            // 高亮当前卡片
            var zxc_items = document.querySelectorAll(".zxc_item");
            for (var zxc_i = 0; zxc_i < zxc_items.length; zxc_i++) {
                zxc_items[zxc_i].className =
                    Number(zxc_items[zxc_i].getAttribute("data-zxc_id")) === zxc_id
                        ? "zxc_item zxc_active" : "zxc_item";
            }

            var zxc_box = document.getElementById("zxc_detail");
            zxc_box.className = "zxc_detail";
            zxc_show_status("正在加载商品 " + zxc_id + " 的详情……", "zxc_loading");

            fetch(zxc_API_DETAIL + zxc_id)
                .then(function (zxc_res) {
                    if (!zxc_res.ok) { throw new Error("HTTP 状态码 " + zxc_res.status); }
                    return zxc_res.json();
                })
                .then(function (zxc_p) {
                    zxc_show_status("");
                    var zxc_html =
                        "<img src='" + zxc_p.thumbnail + "' alt='" + zxc_escape(zxc_p.title) + "'>" +
                        "<div class='zxc_detail_info'>" +
                            "<h2>" + zxc_escape(zxc_p.title) + "（ID: " + zxc_p.id + "）</h2>" +
                            "<p class='zxc_brand'>" + zxc_escape(zxc_p.brand) + " / " + zxc_escape(zxc_p.category) + "</p>" +
                            "<div>" +
                                "<span class='zxc_kv'><b>价格</b><span class='zxc_num'>$" + zxc_p.price.toFixed(2) + "</span></span>" +
                                "<span class='zxc_kv'><b>折扣</b><span class='zxc_num'>-" + zxc_p.discountPercentage.toFixed(2) + "%</span></span>" +
                                "<span class='zxc_kv'><b>评分</b><span class='zxc_num'>★ " + zxc_p.rating.toFixed(2) + "</span></span>" +
                                "<span class='zxc_kv'><b>库存</b><span class='zxc_num'>" + zxc_p.stock + " 件</span></span>" +
                            "</div>" +
                            "<p class='zxc_desc'>" + zxc_escape(zxc_p.description) + "</p>" +
                            "<div class='zxc_tags'><span class='zxc_tag'>" +
                                zxc_p.tags.map(zxc_escape).join("</span><span class='zxc_tag'>") +
                            "</span></div>" +
                        "</div>";
                    zxc_box.innerHTML = zxc_html;
                    zxc_box.className = "zxc_detail zxc_show";
                })
                .catch(function (zxc_err) {
                    zxc_show_status("详情请求失败：" + zxc_err.message, "zxc_error");
                });
        }

        zxc_load_list(); // 页面打开即加载列表
    </script>
</body>
</html>
