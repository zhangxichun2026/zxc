<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型,box model</title>
    <style>
        body,h2,ul,p{
            margin: 0;
            padding: 0;
        }
        #zhang_a{
            width:400px;
            height:400px;
            border:1px solid #039;
            padding:50px 40px 30px 20px; /*上 右 下 左*/
            margin:40px auto;
        }
        #zhang_b{
            width:400px;
            height:400px;
            border:1px solid #039;
            margin:40px auto;
        }
        /* 扩展: 完成c和d，边框用dotted，宽度为3px */
        #zhang_c {
            width: 400px;
            height: 400px;
            border: 3px dotted #039;      /* 点线边框，宽度3px，颜色保持 #039 */
            padding: 50px 40px 30px 20px; /* 沿用a的内边距，便于对比 */
            margin: 40px auto;
            box-sizing: content-box;       /* 显式声明为标准盒模型（默认） */
        }
        #zhang_d {
            width: 400px;
            height: 400px;
            border: 3px dotted #039;      /* 点线边框，宽度3px */
            padding: 50px 40px 30px 20px; /* 沿用a的内边距 */
            margin: 40px auto;
            box-sizing: border-box;        /* 关键区别：宽高包含内边距和边框 */
        }
        /* 扩展2: 找人和网页，修改其中的3-5部分 —— 此处不执行 */
    </style>
</head>
<body>
    <div id="zhang_a">415张熙淳</div>
    <div id="zhang_b">415张熙淳</div>
    <div id="zhang_c">415张熙淳</div>
    <div id="zhang_d">415张熙淳</div>
</body>
</html>
