<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #zhang_box{
    width:480px;
    padding:8px;
    border:1px solid #ccc;
    font-size:12px;
    margin:20px;
}
#zhang_box h3{
    font-size:16px;
    /* 居中 */
    text-align:center;
    /* 行高33px */
    line-height:33px;
    /* 字间距3px */
    letter-spacing:3px;
    color:#036;
}
#zhang_box p{
    /* 行高150% */
    line-height:150%;
    color:#666;
    /* 首行缩进2em */
    text-indent:2em;
}
#zhang_box a{
    color:#f11;
    text-decoration:none;
    /*加粗*/
    font-weight:bold;   
}

/* ===== 扩展部分 ===== */
/* 学号:蓝色加粗 */
.zhang_stu-id{
    color:blue;
    font-weight:bold;
}
/* 姓名:深色加粗 */
.zhang_yname{
    color:#333;
    font-weight:bold;
}
/* 难度的值:红色加粗 */
.zhang_difficulty{
    color:red;
    font-weight:bold;
}
/* 知识点:紫色边框,边框为额外内容 */
.zhang_knowledge{
    border:1px solid purple;
}
/* =================== */

    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="zhang_box">
        <h3>CSS那些事</h3>
        <p>
            <span class="zhang_stu-id">学号:24002060415</span>,姓名:<span class="zhang_yname">张熙淳</span>,<span>班级</span>计算机24006,对于《高级网页设计》的
            这个例子对应的知识点是: <span class="zhang_knowledge">群组选择器、后代选择器、层叠与继承</span>。难度:<span class="zhang_difficulty">高级</span>
            <a href="#">更多>></a>
        </p>
    </div>
    <!--扩展：学号:蓝色加粗;姓名:深色加粗,难度的值:红色加粗,
    知识点:紫色边框,边框为额外内容,使用内部css-->
</body>
</html>
