<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
             padding: 0%;
           margin: 0%;
        }
        .zhang_title{
           display: flex;
           width: 500px;
           height: 33px;
           line-height: 33px;
           margin:50px;
        }
        .zhang_title h2{
           font-size: 14px;
           padding-left: 10px;
        }
        .zhang_title a{
           font-size: 12px;
           color: #ccc;
           text-decoration: none;
           margin-left: 6px;
        }
        .zhang_title:first-child{
            display:flex;
            justify-content: space-between;
            border: 1px solid #ccc;
        }
        .zhang_title:nth-child(2){
            display: flex;
            border: 1px solid #ccc;
        }
       .zhang_title:nth-child(2) h2{
            flex-grow: 1;
        }
        .zhang_title:nth-child(3) {
            position: relative;
            border-bottom: 1px solid #ccc;
            
        }
        .zhang_title:nth-child(3) a{
            position: absolute;
            right: 10px;
            top: 0;
        }
    </style>
</head>
<body>
    <div class="zhang_title">
         <h2>张熙淳的标题
         <a href="#">更多</a>
    </div>
